version: '3.8'

services:
  # 1. Cơ sở dữ liệu PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: medbook-db
    restart: always
    environment:
      POSTGRES_DB: medbook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend FastAPI Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medbook-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/medbook
      - SECRET_KEY=medbook-secret-key-change-in-production-2024
      - FRONTEND_URL=http://localhost:5500/frontend
    ports:
      - "8000:8000"
    depends_on:
      - db

  # 3. Frontend Web Server (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medbook-frontend
    restart: always
    ports:
      - "5500:80"
    depends_on:
      - backend

volumes:
  postgres_data:
